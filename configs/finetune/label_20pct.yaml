# label_20pct.yaml -- extended label-budget column (reviewer Priority-1).
#
# Reveals the labels of the earliest contiguous 20% of the time-ordered train
# split (no shuffling) and fits the FastText field-aware detector's supervised
# subtype classifier. Added to show the detector is NOT inherently capped at the
# 5%-budget macro-F1 -- accuracy rises with the label budget. Inherits everything
# else from _base.yaml (-> fasttext_base.yaml).
extends: configs/finetune/_base.yaml

data:
  label_budget: 0.20

output_dir: models/detector/finetuned/label_20pct/
results_path: results/table_03_rq1_baselines/proposed_fasttext.json
