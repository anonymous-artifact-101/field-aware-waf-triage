# label_50pct.yaml -- extended label-budget column (reviewer Priority-1).
#
# Reveals the labels of the earliest contiguous 50% of the time-ordered train
# split (no shuffling) and fits the FastText field-aware detector's supervised
# subtype classifier. The upper end of the budget sweep, demonstrating the
# accuracy ceiling of the representation as labels grow. Inherits everything else
# from _base.yaml (-> fasttext_base.yaml).
extends: configs/finetune/_base.yaml

data:
  label_budget: 0.50

output_dir: models/detector/finetuned/label_50pct/
results_path: results/table_03_rq1_baselines/proposed_fasttext.json
