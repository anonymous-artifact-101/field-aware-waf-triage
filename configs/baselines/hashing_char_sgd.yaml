# hashing_char_sgd.yaml -- stateless feature-hashing char-ngram baseline.
#
# Compact sparse comparator for the edge-deployment story: HashingVectorizer has
# no learned vocabulary; footprint is mostly the linear SGD coefficient matrix.
baseline: hashing_char_sgd
family: classical_supervised_sparse
row: Hashing char-ngram + SGD

data:
  train_split: owasp_train
  val_split: owasp_val
  test_split: owasp_test
  label_budget: 0.05

features:
  representation: hashing_char_ngram
  analyzer: char_wb
  ngram_range: [2, 5]
  n_features: 262144
  alternate_sign: false
  norm: l2
  lowercase: false
  fields: [method, path, query, ua, status, timing]

model:
  loss: hinge
  alpha: 0.00001
  max_iter: 1000
  tol: 0.001
  class_weight: balanced
  num_classes: 8

seed: 42
results_path: results/table_03_rq1_baselines/hashing_char_sgd.json
output_dir: models/baselines/hashing_char_sgd/
