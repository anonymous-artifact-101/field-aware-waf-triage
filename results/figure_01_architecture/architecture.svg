<svg xmlns="http://www.w3.org/2000/svg" width="760" height="740" viewBox="0 0 760 740"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#33424f"/></marker></defs><rect x="0" y="0" width="760" height="740" fill="white"/><text x="380.0" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1b262c">Field-Aware FastText Detector</text><rect x="150.0" y="50" width="460" height="42" rx="8" fill="#eef2f7" stroke="#33424f" stroke-width="1.5"/><text x="380.0" y="67.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1b262c">Reverse-proxy access-log record</text><text x="380.0" y="84.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1b262c">method path query ua status timing (raw line)</text><line x1="380.0" y1="92" x2="380.0" y2="132" stroke="#33424f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="380.0" y="116.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1b262c">parse into typed fields</text><rect x="150.0" y="132" width="70.0" height="34" rx="6" fill="#dbe7f3" stroke="#33424f" stroke-width="1.2"/><text x="185.0" y="153" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b262c">method</text><rect x="228.0" y="132" width="70.0" height="34" rx="6" fill="#dbe7f3" stroke="#33424f" stroke-width="1.2"/><text x="263.0" y="153" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b262c">path</text><rect x="306.0" y="132" width="70.0" height="34" rx="6" fill="#dbe7f3" stroke="#33424f" stroke-width="1.2"/><text x="341.0" y="153" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b262c">query</text><rect x="384.0" y="132" width="70.0" height="34" rx="6" fill="#dbe7f3" stroke="#33424f" stroke-width="1.2"/><text x="419.0" y="153" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b262c">ua</text><rect x="462.0" y="132" width="70.0" height="34" rx="6" fill="#dbe7f3" stroke="#33424f" stroke-width="1.2"/><text x="497.0" y="153" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b262c">status</text><rect x="540.0" y="132" width="70.0" height="34" rx="6" fill="#dbe7f3" stroke="#33424f" stroke-width="1.2"/><text x="575.0" y="153" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b262c">timing</text><line x1="380.0" y1="166" x2="380.0" y2="198" stroke="#33424f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="380.0" y="186.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1b262c">per-field FastText embed + mean-pool</text><rect x="150.0" y="198" width="460" height="50" rx="8" fill="#cfe3d4" stroke="#33424f" stroke-width="1.5"/><text x="380.0" y="219.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1b262c">Per-Field FastText Embedding + Pool</text><text x="380.0" y="236.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1b262c">6 field block(s), each -&gt; 64-d vector</text><rect x="-114.0" y="196" width="250" height="54" rx="6" fill="none" stroke="#33424f" stroke-width="1" stroke-dasharray="4 3"/><text x="11.0" y="214" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b262c">FastText pre-trained self-supervised</text><text x="11.0" y="228" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b262c">on benign corpus (weblog_pretrain);</text><text x="11.0" y="242" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b262c">char n-grams embed OOV payloads</text><line x1="380.0" y1="248" x2="380.0" y2="280" stroke="#33424f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="380.0" y="268.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1b262c">concatenate per-field vectors</text><rect x="150.0" y="280" width="460" height="48" rx="8" fill="#f6e2c3" stroke="#33424f" stroke-width="1.5"/><text x="380.0" y="300.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1b262c">Concatenated Field-Aware Feature</text><text x="380.0" y="317.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1b262c">D = 6 x 64 = 384</text><line x1="380.0" y1="328" x2="380.0" y2="362" stroke="#33424f" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="200.0" y="362" width="360" height="50" rx="8" fill="#e7d6ef" stroke="#33424f" stroke-width="1.5"/><text x="380.0" y="383.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1b262c">Classical Head (LinearSVC)</text><text x="380.0" y="400.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1b262c">subtype prediction (class_weight balanced)</text><line x1="380.0" y1="412" x2="380.0" y2="452" stroke="#33424f" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="180.0" y="452" width="400" height="46" rx="8" fill="#f3d2d2" stroke="#33424f" stroke-width="1.5"/><text x="380.0" y="471.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1b262c">Per-Field Anomaly Attribution</text><text x="380.0" y="488.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1b262c">block-zeroing delta -&gt; which field explains the detection</text><rect x="16" y="714" width="14" height="14" rx="3" fill="#dbe7f3" stroke="#33424f" stroke-width="1"/><text x="36" y="725" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1b262c">parse</text><rect x="86" y="714" width="14" height="14" rx="3" fill="#cfe3d4" stroke="#33424f" stroke-width="1"/><text x="106" y="725" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1b262c">FastText embed</text><rect x="228" y="714" width="14" height="14" rx="3" fill="#f6e2c3" stroke="#33424f" stroke-width="1"/><text x="248" y="725" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1b262c">concat</text><rect x="306" y="714" width="14" height="14" rx="3" fill="#e7d6ef" stroke="#33424f" stroke-width="1"/><text x="326" y="725" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1b262c">classical head</text><rect x="448" y="714" width="14" height="14" rx="3" fill="#f3d2d2" stroke="#33424f" stroke-width="1"/><text x="468" y="725" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1b262c">attribution</text></svg>